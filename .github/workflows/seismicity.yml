name: Significant Earthquakes

on:
  schedule:
    # Run once per day at 07:17 local time (America/Los_Angeles).
    - cron: '17 7 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: significant-earthquakes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the Python/GMT environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/environment.yml
          environment-name: seismicity
          init-shell: bash
          cache-environment: true
          cache-downloads: true

      - name: Prepare writable GMT data directories
        run: |
          mkdir -p "$RUNNER_TEMP/gmt-user" "$RUNNER_TEMP/gmt-cache"
          chmod 700 "$RUNNER_TEMP/gmt-user" "$RUNNER_TEMP/gmt-cache"
          echo "GMT_USERDIR=$RUNNER_TEMP/gmt-user" >> "$GITHUB_ENV"
          echo "GMT_CACHEDIR=$RUNNER_TEMP/gmt-cache" >> "$GITHUB_ENV"

      - name: Verify Python, PyGMT, GMT, and GMT directories
        run: |
          python --version
          gmt --version
          python -c "import geopandas, pygmt; print('GeoPandas:', geopandas.__version__); print('PyGMT:', pygmt.__version__)"
          printf 'GMT_USERDIR=%s\nGMT_CACHEDIR=%s\n' "$GMT_USERDIR" "$GMT_CACHEDIR"
          test -d "$GMT_USERDIR" && test -w "$GMT_USERDIR"
          test -d "$GMT_CACHEDIR" && test -w "$GMT_CACHEDIR"
          gmt get GMT_DATA_SERVER

      - name: Run seismicity script
        run: python assets/seismicity_v2.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/README.log seismicity.md assets/images/seismicity/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update significant earthquake maps"
          git push
